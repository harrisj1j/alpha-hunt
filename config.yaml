# ------------------------------------------------------------
# EXCLUSIONS
# ------------------------------------------------------------
# Example: exclude junior/QA/mobile-only roles, but keep senior
# levels in since this example config targets senior IC roles.
# ------------------------------------------------------------
exclude_keywords:

  # ------------------------------------------------------------
  # MANAGEMENT / EXECUTIVE
  # ------------------------------------------------------------
  - "Senior Staff"
  - "Staff+"
  - "Staff Engineer"
  - "Principal"
  - "Director"
  - "Vice President"
  - "VP "
  - "Chief"
  - "CTO"
  - "CIO"
  - "CISO"
  - "Head of"
  - "Executive Director"
  - "Manager II"
  - "Manager III"
  - "Senior Manager"

  # ------------------------------------------------------------
  # EXPERIENCE LEVELS ABOVE ENTRY
  # ------------------------------------------------------------
  - "Senior"
  - "Sr."
  - "Sr "
  - "Lead"
  - "Expert"

  # ------------------------------------------------------------
  # TEMPORARY / STUDENT ROLES
  # ------------------------------------------------------------
  - "Intern"
  - "Internship"
  - "Co-op"
  - "Coop"
  - "Graduate Program"
  - "Fresher"
  - "Trainee"
  - "Apprentice"

  # ------------------------------------------------------------
  # DEVELOPMENT AREAS YOU DON'T WANT
  # ------------------------------------------------------------
  - "Frontend Developer"
  - "Frontend Engineer"
  - "Front End Developer"
  - "Front End Engineer"
  - "React Developer"
  - "React Engineer"
  - "React Native Developer"
  - "Mobile Developer"
  - "Mobile Engineer"
  - "Android Developer"
  - "Android Engineer"
  - "iOS Developer"
  - "iOS Engineer"
  - "WordPress Developer"

  # ------------------------------------------------------------
  # QA / TESTING ROLES YOU DON'T WANT
  # ------------------------------------------------------------
  - "SDET"
  - "Software Development Engineer in Test"
  - "Automation Tester"
  - "Automation Test Engineer"
  - "Test Automation Engineer"

  # ------------------------------------------------------------
  # SUPPORT ROLES TO AVOID
  # ------------------------------------------------------------
  - "Sales Engineer"
  - "Sales Development"
  - "Business Development Representative"
  - "Sales Representative"
  - "Technical Sales"
  - "Commission Only"

  # ------------------------------------------------------------
  # NON-TECHNICAL SUPPORT
  # ------------------------------------------------------------
  - "Call Center"
  - "Call Centre"
  - "Customer Service Representative"
  - "Customer Service Agent"
  - "Customer Service Rep"

  # Keep technical support, IT support, product support,
  # service desk, and SaaS support.

  # ------------------------------------------------------------
  # SECURITY CLEARANCE RESTRICTIONS
  # ------------------------------------------------------------
  # Only use these if you specifically cannot obtain clearance.
  # - "Top Secret"
  # - "TS/SCI"
  # - "Secret Clearance"

